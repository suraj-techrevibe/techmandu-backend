<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .wrapper {
            background: #f4f4f4; /* Background color */
            height: 500px; /* Adjusted height for better spacing */
            display: flex;
            justify-content: center;
            align-items: stretch;
            width: 90%; /* Full width with a max */
            max-width: 800px; /* Max width for larger screens */
            border-radius: 10px; /* Border radius */
            border: 1px solid #e0e0e0; /* Border color */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .image-section {
            flex: 1; /* Take remaining space */
            position: relative;
            overflow: hidden;
            border-top-left-radius: 10px; /* Round corners */
            border-bottom-left-radius: 10px; /* Round corners */
        }

        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-section {
            flex: 1; /* Take remaining space */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px; /* Padding around the form */
            flex-direction: column;
            background-color: white; /* Background color for form */
            border-top-right-radius: 10px; /* Round corners */
            border-bottom-right-radius: 10px; /* Round corners */
        }

        .form-title {
            font-weight: bold;
            font-size: 1.6rem; /* Increased font size for title */
            margin-bottom: 20px;
            color: #737373; /* Color */
        }

        .form-group {
            margin-bottom: 20px; /* Increased margin for better spacing */
            width: 100%; /* Full width */
            position: relative; /* For positioning the icon */
        }

        .form-group input {
            display: block;
            width: 90%;
            padding: 12px 16px !important;
            background: #fff;
            font-size: 14px;
            color: #52667a;
            outline: none;
            border: 1px solid #ccc;
            border-radius: 4px;
            -webkit-appearance: none;
        }

        .eye-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #005E80;
        }

        .submit-button {
            width: 100%;
            padding: 12px 16px;
            font-weight: bold;
            color: white;
            background-color: #005E80; /* Primary color */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            position: relative;
        }

        .loading {
            display: none;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: white;
        }

        .error-message {
            color: red;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .requirements {
            font-size: 0.9rem;
            color: #737373;
            margin-top: 10px;
            text-align: center; /* Center text for requirements */
        }

        /* Popup Styles */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .popup-message {
            margin-bottom: 15px;
        }

        .popup-button {
            padding: 10px 15px;
            background-color: #005E80;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        /* Media Query to Hide Image Section on Mobile */
        @media (max-width: 768px) {
            .image-section {
                display: none; /* Hide image section on small screens */
            }

            .wrapper {
                height: auto; /* Allow the wrapper to adjust height for mobile */
                flex-direction: column; /* Stack the form section on top of the image */
            }

            .form-section {
                padding: 20px; /* Adjust padding for mobile */
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="image-section">
            <img src="https://images.unsplash.com/photo-1582554943392-e6926ef42630?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8ODl8fG5lcGFsfGVufDB8fDB8fHww" alt="Reset Password Image" />
        </div>
        <div class="form-section">
            <p class="form-title">Reset Your Password</p>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <input type="password" id="new_password" placeholder="New Password" required />
                    <i class="eye-icon far fa-eye" onclick="togglePasswordVisibility('new_password', this)"></i>
                </div>
                <div class="error-message" id="passwordError" style="display: none;"></div>

                <div class="form-group">
                    <input type="password" id="confirm_password" placeholder="Confirm Password" required />
                    <i class="eye-icon far fa-eye" onclick="togglePasswordVisibility('confirm_password', this)"></i>
                </div>
                <div class="error-message" id="confirmError" style="display: none;"></div>

                <button type="button" class="submit-button" onclick="handleResetPassword()">
                    Submit
                    <i class="loading fas fa-spinner fa-spin"></i>
                </button>

                <div class="requirements">
                    <span style="color: red;"> * </span> Password must be at least 8 characters long and match.
                </div>
            </form>
        </div>
    </div>

    <!-- Popup and Overlay -->
    <div class="popup-overlay" id="popupOverlay"></div>
    <div class="popup" id="popup">
        <div class="popup-message" id="popupMessage"></div>
        <button class="popup-button" onclick="closePopup()">OK</button>
    </div>

    <script>
        function getHost() {
                const currentUrl = window.location.href;
                const url = new URL(currentUrl);
                return `${url.protocol}//${url.host}`;
            }

        const host = getHost(); 

        function handleResetPassword() {
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            const passwordError = document.getElementById('passwordError');
            const confirmError = document.getElementById('confirmError');

            // Reset error messages
            passwordError.style.display = 'none';
            passwordError.textContent = '';
            confirmError.style.display = 'none';
            confirmError.textContent = '';

            let hasError = false;

            // Validate password length
            if (newPassword.length < 8) {
                passwordError.textContent = 'Password must be at least 8 characters long.';
                passwordError.style.display = 'block';
                hasError = true;
            }

            // Validate confirmation
            if (newPassword !== confirmPassword) {
                confirmError.textContent = 'Passwords do not match.';
                confirmError.style.display = 'block';
                hasError = true;
            }

            // If there are errors, do not proceed
            if (hasError) return;

            // Show loading effect
            const loadingIcon = document.querySelector('.loading');
            loadingIcon.style.display = 'inline-block';

            // Prepare data for POST request
            const data = {
                password: newPassword
            };
            const currentUrl = window.location.href;
            const url = new URL(currentUrl);
            const expiry = url.searchParams.get('expiry');
            const token = url.searchParams.get('token');
            const id = url.pathname.split('/').pop(); 
            fetch(`${host}/auth/reset/${id}?expiry=${expiry}&token=${token}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                return response.json(); // Assuming the server responds with JSON
            })
            .then(data => {
                // Hide loading effect
                loadingIcon.style.display = 'none';

                if (data.success === true) {
                    showPopup("Password changed successfully");
                    setTimeout(() => {
                        window.location.href = `${host}/admin`; // Replace with your desired URL
                    }, 1500);
                } else {
                    showPopup("Failed to change password. Please try again.");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                loadingIcon.style.display = 'none';
                showPopup('There was an error resetting your password. Please try again later.');
            });
        }

        function showPopup(message) {
            document.getElementById('popupMessage').textContent = message;
            document.getElementById('popup').style.display = 'block';
            document.getElementById('popupOverlay').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
            document.getElementById('popupOverlay').style.display = 'none';
            // Clear input fields after closing the popup
            document.getElementById('new_password').value = '';
            document.getElementById('confirm_password').value = '';
        }

        function togglePasswordVisibility(passwordFieldId, icon) {
            const passwordField = document.getElementById(passwordFieldId);
            const type = passwordField.type === "password" ? "text" : "password";
            passwordField.type = type;

            // Change icon based on visibility
            icon.classList.toggle("fa-eye");
            icon.classList.toggle("fa-eye-slash");
        }
    </script>
</body>
</html>

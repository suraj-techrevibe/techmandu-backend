<vdr-page-block>
    <vdr-action-bar>
        <vdr-ab-left>
            <vdr-action-bar-items locationId="banner-list"></vdr-action-bar-items>
        </vdr-ab-left>
        <vdr-ab-right>
            <a class="btn btn-primary" [routerLink]="['./create']">
                <clr-icon shape="plus"></clr-icon>
                Create Banner
            </a>
        </vdr-ab-right>
    </vdr-action-bar>

    <ng-container *ngIf="banners$ | async as banners">
        <table class="table" style="width: 100%; margin-top: 1rem;">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>CTA</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let banner of banners" style="cursor: pointer;" (click)="onBannerClick(banner)">
                    <td>
                        <img 
                            *ngIf="banner.image?.preview"
                            [src]="banner.image.preview + '?preset=tiny'" 
                            [alt]="banner.title"
                            style="max-width: 80px; height: auto; border-radius: 4px;" />
                        <clr-icon *ngIf="!banner.image?.preview" shape="image" size="24"></clr-icon>
                    </td>
                    <td><strong>{{ banner.title }}</strong></td>
                    <td>{{ banner.description | slice:0:80 }}{{ banner.description.length > 80 ? '...' : '' }}</td>
                    <td>
                        {{ banner.ctaText }}
                        <a 
                            [href]="banner.ctaLink" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            (click)="$event.stopPropagation()"
                            style="margin-left: 0.5rem;">
                            <clr-icon shape="pop-out" size="16"></clr-icon>
                        </a>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-secondary" (click)="onBannerClick(banner); $event.stopPropagation()">
                            Edit
                        </button>
                        <button class="btn btn-sm btn-danger" (click)="deleteBanner(banner); $event.stopPropagation()">
                             <clr-icon shape="trash" class="is-solid"></clr-icon>
                            Delete
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </ng-container>
</vdr-page-block>

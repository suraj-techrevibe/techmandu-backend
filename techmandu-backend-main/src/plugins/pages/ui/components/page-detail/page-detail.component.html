<vdr-page-body>
    <vdr-page-block>
        <vdr-action-bar>
            <vdr-ab-left>
                <div class="flex clr-flex-row"></div>
                <vdr-language-selector
                    [disabled]="isNew$ | async"
                    [availableLanguageCodes]="availableLanguages$ | async"
                    [currentLanguageCode]="languageCode$ | async"
                    (languageCodeChange)="setLanguage($event)"
                ></vdr-language-selector>
            </vdr-ab-left>
            <vdr-ab-right>
                <button
                    class="button primary"
                    *ngIf="isNew$ | async; else updateButton"
                    (click)="create()"
                    [disabled]="detailForm.pristine || detailForm.invalid"
                >
                    {{ 'common.create' | translate }}
                </button>
                <ng-template #updateButton>
                    <button
                        class="btn btn-primary"
                        (click)="update()"
                        [disabled]="detailForm.pristine || detailForm.invalid"
                    >
                        {{ 'common.update' | translate }}
                    </button>
                </ng-template>
            </vdr-ab-right>
        </vdr-action-bar>
    </vdr-page-block>

    <form class="form" [formGroup]="detailForm">
        <vdr-page-detail-layout>
            <vdr-page-detail-sidebar>
                <vdr-card>
                    <vdr-form-field [label]="'catalog.visibility' | translate" for="visibility">
                        <clr-toggle-wrapper>
                            <input
                                type="checkbox"
                                clrToggle
                                [name]="'common.enabled' | translate"
                                [formControl]="detailForm.get(['enabled'])"
                            />
                            <label>{{ 'common.enabled' | translate }}</label>
                        </clr-toggle-wrapper>
                    </vdr-form-field>
                </vdr-card>
                <vdr-card [title]="'page.page-group' | translate" *ngIf="!(isNew$ | async)">
                    <vdr-form-field for="group">
                        <ng-select
                            [items]="groups$ | async"
                            bindLabel="name"
                            bindValue="id"
                            [searchable]="true"
                            formControlName="groupId"
                            placeholder="{{ 'page.select-page-group' | translate }}"
                        ></ng-select>
                    </vdr-form-field>
                </vdr-card>
                <vdr-card *ngIf="entity$ | async as entity">
                    <vdr-page-entity-info [entity]="entity" />
                </vdr-card>
            </vdr-page-detail-sidebar>

            <vdr-page-block>
                <vdr-card>
                    <div class="form-grid">
                        <vdr-form-field [label]="'page.title' | translate" for="title">
                            <input id="title" type="text" formControlName="title" />
                        </vdr-form-field>

                        <vdr-form-field [label]="'common.slug' | translate">
                            <input type="text" formControlName="slug" required />
                        </vdr-form-field>
                        <vdr-form-field [label]="'page.meta-title' | translate">
                            <input type="text" formControlName="metaTitle" />
                        </vdr-form-field>
                        <vdr-form-field [label]="'page.meta-keywords' | translate">
                            <input
                                type="text"
                                formControlName="metaKeywords"
                                placeholder="Comma separated keywords. Ex: finance, banking"
                            />
                        </vdr-form-field>

                        <vdr-form-field [label]="'page.meta-description' | translate" class="form-grid-span">
                            <textarea type="text" rows="10" formControlName="metaDescription"></textarea>
                        </vdr-form-field>

                        <vdr-rich-text-editor
                            formControlName="content"
                            class="required-label"
                            [label]="'page.content' | translate"
                            class="form-grid-span"
                        ></vdr-rich-text-editor>
                    </div>
                </vdr-card>
            </vdr-page-block>
        </vdr-page-detail-layout>
    </form>
</vdr-page-body>
